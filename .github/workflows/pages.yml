name: Deploy sito su GitHub Pages

on:
  push:
    branches:
      - claude/great-gauss-6joo7v
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Pages (abilita se necessario)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Carica il sito come artefatto
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
